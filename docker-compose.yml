# Full RiceWatch stack: Postgres (with bundled data) + API + Web
# First start on a new laptop loads docker/postgres/init/*.sql into a fresh volume.
# If you already had an empty/demo volume, reset once: docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: ricewatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ricewatch
      POSTGRES_PASSWORD: ricewatch_secret
      POSTGRES_DB: ricewatch
    ports:
      - "5435:5432"
    volumes:
      - ricewatch_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ricewatch -d ricewatch"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ricewatch-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ricewatch:ricewatch_secret@postgres:5432/ricewatch?schema=public
      PORT: "4001"
      JWT_SECRET: ricewatch-dev-jwt-secret-change-in-production
      CORS_ORIGIN: http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: ricewatch-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  ricewatch_pg_data:
