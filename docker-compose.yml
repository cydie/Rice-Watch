# Postgres for RiceWatch. Docker Desktop must be Running (green).
# The user, password, and database are created automatically — pgAdmin is not needed.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ricewatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ricewatch
      POSTGRES_PASSWORD: ricewatch_secret
      POSTGRES_DB: ricewatch
    ports:
      - "5435:5432"
    volumes:
      - ricewatch_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ricewatch -d ricewatch"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  ricewatch_pg_data:
